<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>slider</title>
</head>
<body>
    <div class="slider">
        <div class="arrow-prev">&#10094;</div>
        <div class="main-slider">
            <img src="./images/img1.jfif" alt="Slider Image">
            <div class="counter">1 / 8</div>
        </div>
        <div class="arrow-next">&#10095;</div>
        <div class="thumbnails">
            <div class="thum active">
                <img  src="./images/img1.jfif" alt="Thumbnail 1">
            </div>
            <div class="thum">
                <img  src="./images/img2.jfif" alt="Thumbnail 2">
            </div>
            <div class="thum">
                <img  src="./images/img3.jfif" alt="Thumbnail 3">
            </div>
            <div class="thum">
                <img  src="./images/img4.jfif" alt="Thumbnail 4">
            </div>
            <div class="thum">
                <img  src="./images/img5.jfif" alt="Thumbnail 5">
            </div>
            <div class="thum">
                <img src="./images/img6.jpg" alt="Thumbnail 6">
            </div>
            <div class="thum">
                <img src="./images/img7.jfif" alt="Thumbnail 7">
            </div>
            <div class="thum">
                <img src="./images/img8.jfif" alt="Thumbnail 8">
            </div>
        </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
